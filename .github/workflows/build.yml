# Builds Slit on a GitHub-hosted Mac (which has Xcode), runs the tests and
# packages the DMG. The DMG is attached to each run as a downloadable artifact.
#
# The build is ad-hoc signed (no Developer ID), exactly like a local
# ./build_app.sh --dmg without a certificate.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Build app and DMG
        run: ./build_app.sh --dmg

      - name: Check the signature can load Sparkle
        # GitHub's Macs load the framework even when a user's Mac refuses to,
        # so check the cause directly: an ad-hoc build must not use the
        # hardened runtime (see build_app.sh). This is what broke v1.1.
        run: |
          for code in Slit.app Slit.app/Contents/Frameworks/Sparkle.framework; do
            info=$(codesign -dv "$code" 2>&1)
            echo "$code: $(echo "$info" | grep -E '^CodeDirectory')"
            if echo "$info" | grep -q 'Signature=adhoc' && echo "$info" | grep -q 'flags=.*runtime'; then
              echo "::error::$code is ad-hoc signed with the hardened runtime; it will crash at launch"
              exit 1
            fi
          done

      - name: Launch smoke test
        # Catches an app that cannot even start, e.g. Sparkle.framework failing
        # to load. The app stays running (waiting for permissions) if it's fine.
        run: |
          ./Slit.app/Contents/MacOS/TextReaderHelper > launch.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            echo "Slit is still running after 10 s"
            kill "$pid"
          else
            echo "Slit exited during launch:"
            cat launch.log
            exit 1
          fi

      - name: Checksum
        run: shasum -a 256 dist/slit.dmg | tee dist/slit.dmg.sha256

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: slit-dmg-${{ github.sha }}
          path: |
            dist/slit.dmg
            dist/slit.dmg.sha256
          if-no-files-found: error
          retention-days: 30
